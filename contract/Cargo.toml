[package]
name = "frogpress"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
near-sdk = { version = "=5.17.2", default-features = false, features = ["legacy"] }
near-contract-standards = "=5.17.2"
borsh = "1"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1

